{% extends "base.html" %}

{% block title %}
Shopkart | Payment
{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 shadow" style="max-width: 500px; width: 100%;">
        <h2 class="fw-bold mb-4 text-center">Complete Payment</h2>

        <div class="alert alert-info text-center" role="alert">
            Total Amount: <strong>₹{{ total_amount }}</strong>
        </div>

        <div class="d-grid gap-2">
            <button id="rzp-button1" class="btn btn-primary btn-lg">Pay with Razorpay</button>
            <a href="{% url 'payment_success' %}?order_id={{data.receipt}}&payment_id=sim_test_{{data.receipt}}"
                class="btn btn-outline-secondary btn-lg">Simulate Payment (Test)</a>

        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{razorpay_key_id}}", // Enter the Key ID generated from the Dashboard
        "amount": "{{data.amount}}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
        "currency": "INR",
        "name": "Shopkart Ecommerce",
        "description": "Test Transaction",
        "image": "https://example.com/your_logo",
        "order_id": "{{payment.id}}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1

        "handler": function (response) {
            window.location.href = `/payment-success?payment_id=${response.razorpay_payment_id}&order_id={{data.receipt}}`
        },

        "prefill": {
            "name": "Gaurav Kumar",
            "email": "gaurav.kumar@example.com",
            "contact": "9000090000"
        },
        "notes": {
            "address": "Razorpay Corporate Office"
        },
        "theme": {
            "color": "#3399cc"
        }
    };
    var rzp1 = new Razorpay(options);
    rzp1.on('payment.failed', function (response) {
        alert(response.error.code);
        alert(response.error.description);
        alert(response.error.source);
        alert(response.error.step);
        alert(response.error.reason);
        alert(response.error.metadata.order_id);
        alert(response.error.metadata.payment_id);
    });
    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    }
</script>
{% endblock content %}
